spring:
  main:
    banner-mode: "off"
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:cluster-kafka-dev-kafka-bootstrap.amqstreams.svc:9095}
    properties:
      security.protocol: PLAINTEXT
    consumer:
      group-id: ${KAFKA_GROUP_ID:springboot-consumer-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  kafka:
    topic: ${KAFKA_TOPIC:test}